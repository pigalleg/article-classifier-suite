# Added by populate_few_shot_ra_from_excel_evaluations.py
# Source: Excel sheet row abstract_id=45 question_id=12
  - id: id_excel_abs45_ra12
    target_type: RA
    abstract: >-
      this paper proposes a new time aggregation method that can properly reflect the spatial aspect of the data sources alongside their temporal behaviour when multiple variable energy resources are involved. each representative period, constructed by the proposed method, can include more than one representative day, which, in itself, represents a group of data sources that are highly associated with each other. it also preserves the spatial relationship among data sources as a whole by constructing a hybrid centroid. two case studies, each with different data sources and networks, with and without energy storage, are considered for this study. in the second case, we add an storage to reflect the significance of preserving shape of patterns in the representative periods. the duration curves of wind farms and solar farms generations, electricity demand, and net demand are used as data-based evaluation indices to compare the performance of the proposed method against other approaches. in addition, an ieee 24-bus and a 6-bus test system are considered for the case studies. two model-based evaluation indices are used to measure the performance of the clustering methods, including the power flow of all the lines in the system and the annual operation cost of the system. in addition, the performance of the proposed method in the presence of energy storage is evaluated and compared with existing methods.
    targets:
      - target_id: "12"
        score: 30
        rationale: >-
          Why this score was assigned:
          This is a methods based abstract that has some small potential link to the research agenda.  The research question is seeking methods to use when trying to account for DERs in planning and techno economic analysis and this abstract may be useful when dealing with aggregation of the spatial /DER aspects.
          
          Why this abstract falls below the next relevance level:
          This is an abstract with a potential link to some aspects of the G-PST research agenda in the DER space.  It shares data and aggregation of variable renewable energy within the scope of the abstract.  It is at best an incremental contribution and has only some small case studies that are not obviously directly related to the research agenda.

# Added by populate_few_shot_ra_from_excel_evaluations.py
# Source: Excel sheet row abstract_id=228 question_id=15
  - id: id_excel_abs228_ra15
    target_type: RA
    abstract: >-
      deep penetration of distributed energy resources (ders) and electric vehicles (evs) introduce benefits but may cause the overloading of service transformers in distribution networks. such situations require real-time transformer loading information, where an accurate mapping between smart meters and distribution transformers is a prerequisite, e.g., summing the downstream smart meter consumptions. due to arbitrary curvature in streets, we propose to employ a density-based clustering based on voltage magnitudes (continuous) and street name (categorical) information. however, a density-based approach may only be able to localize a meter to a street segment. hence, we use a second-stage spectral clustering with distance along the street (das), a novel feature, to obtain meter clusters, each with a common parent transformer. for mapping transformers to meter clusters, we use the nearest cluster center approach based on the location since voltage measurements may not be available at transformers. moreover, we provide a theoretical guarantee for such an approach. finally, we illustrate the usefulness of the proposed algorithm on long streets, which is a challenging scenario due to many possible incorrect combinations of meter-transformer mapping. the proposed algorithm has been tested on modified ieee 8-, 69-, 123-bus test systems and real distribution feeders from a utility in the southwestern united states, demonstrating outstanding performance.
    targets:
      - target_id: "15"
        score: 30
        rationale: >-
          Why this score was assigned:
          This abstract addresses a distribution level challenge that can have some impact on the higher level transmission related problems that are the focus of the G-PST research agenda.  It does however have a good potential link to a real practical problem as indicated by the real distribution utility application.
          
          Why this abstract falls below the next relevance level:
          The abstract does not address a research question in any direct way - it is focussed on the distribution system and not the transmission system therefore its link to the research question is minimal.  While there is an application in the abstract it is not on the transmission system so that is a big weakness with respect to a strong link with the research question.

# Added by populate_few_shot_ra_from_excel_evaluations.py
# Source: Excel sheet row abstract_id=231 question_id=39
  - id: id_excel_abs231_ra39
    target_type: RA
    abstract: >-
      coordinated dispatch of integrated transmission-distribution systems (itds) continues to be a hotspot due to the growing demand-side flexibility. decentralized optimization, which has been widely studied, does not conform to the current hierarchical framework of power system operation. this paper proposes a centralized distributionally robust chance-constrained dispatch model for itds. the transmission system operator considers the flexible ranges of large-scale distributed energy resources (ders) in distribution systems via flexibility aggregation. a price-guided flexibility model is proposed to describe the temporally coupled aggregate flexibility of distribution systems. it is constructed by filtering those constraints with a high probability of activeness in the itd dispatch problem, reducing the number of constraints from quadratic to linear with the number of divided time slots while maintaining high accuracy. furthermore, we use the data-driven distributionally robust chance constraint to deal with the uncertainty from both renewable generations and the flexibility of ders. numerical simulations on ieee test systems verify the effectiveness of the proposed methods.
    targets:
      - target_id: "39"
        score: 50
        rationale: >-
          Why this score was assigned:
          There is a potential relationship between the focus of the abstract and the G-PST research agenda.  The abstract focusses on the transmission distribution interface which is important in the DER part of the research agenda and the specific research question is looking into how reliability services in planning can account for deliverability.
          
          Why this abstract falls below the next relevance level:
          The research in the abstract only relates to a small part of the research question and there are no signs of real practical application.  It is also not clear if the abstract can provide real planning related benefits as it is really focussed on operations so more work would need to be done to bring this research in the abstract closer to the practical research question.

# Added by populate_few_shot_ra_from_excel_evaluations.py
# Source: Excel sheet row abstract_id=212 question_id=4
  - id: id_excel_abs212_ra4
    target_type: RA
    abstract: >-
      this article investigates the maximum transferable power (mtp) of inverter-based resources (ibrs) and provides the output capability curves (occs) of grid-tied grid-following inverters (gflis) and grid-forming inverters (gfmis). to this end, in the first part of the article, mathematical equations for gfli static, thermal, and phase-locked loop (pll)-induced power transfer limits are derived in terms of the grid short-circuit ratio (scr) and its x/r ratio. then, considering other operational limitations, such as the ibr ac- and dc-side voltage limits, the occ of the gfli is obtained. additionally, the impact of the reactive current and the reactive control mode on the occ is further studied, and accordingly, an auxiliary control loop is proposed to maximize the gfli mtp. in the second part of the article, a similar approach is employed to derive mathematical equations for gfmi static and thermal limits, and accordingly, the occ of a gfmi is obtained. the effects of the variation of the voltage set-point of the gfmi on its occ are then studied, and the superiority of gfmis compared to gflis is shown in terms of the mtp capability. eventually, several simulation and experimental cases are conducted to validate the obtained equations and occs for both grid-following and grid-forming control modes.
    targets:
      - target_id: "4"
        score: 50
        rationale: >-
          Why this score was assigned:
          Thematically the abstract aligns very well with the IBR research program of the G-PST research agenda and specifically the research reported in this abstract addresses capability and control design.  It also deals with these issues across the range of IBRs i.e. GFM and GFL. The focus of the abstract is in addressing real issues and is not methodologically dominated which is another good sign.
          
          Why this abstract falls below the next relevance level:
          The abstract stops short of services and/or operational decision making which limits its potential linkage to the research question.  Although simulation results and experiments are noted it is not clear if they are at the right scale and applicability to be truly useful nor is it clear if a utility and/or a system operator are involved.

