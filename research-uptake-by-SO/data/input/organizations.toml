[miso]
name = "MISO"
region = "US"
crawl_pages = [
    # misoenergy.org returns 403 to plain requests.get(); render=true uses a
    # real headless browser, which also fixes the search query living in a
    # #fragment (never reached the server as a plain GET). Worth trying
    # since a genuine browser TLS/JS fingerprint often clears simpler WAFs —
    # fall back to seed_pdfs if it still 403s.
    ["https://www.misoenergy.org/search/#q=ieee%20transactions&t=500&p=0&s=&sd=&f=Type%3D%5B%22Document%22%5D", 1, true],
    ["https://www.misoenergy.org/planning/resource-adequacy/", 1, true],
    ["https://www.misoenergy.org/planning/transmission-planning/", 1, true],
    ["https://www.misoenergy.org/planning/long-range-transmission-planning/", 1, true],
]
