    "https://cdn.misoenergy.org/PY%202023-2024%20LOLE%20Study%20Report626798.pdf",
    "https://cdn.misoenergy.org/LRTP%20Tranche%202.1666573.pdf",
]

[pjm]
name = "PJM"
region = "US"
crawl_pages = [
    # Coveo search widget is JS-rendered AND the query lives in a #fragment,
    # which a plain requests.get() never sends to the server — this crawl
    # entry was silently hitting the bare search page with no query at all.
    # render=true fixes both: a real browser executes the JS and reads the
    # fragment via window.location.hash.
    ["https://www.pjm.com/m/Search%20Results.aspx#q=ieee%20transactions&t=coveo4A2453FD&numberOfResults=100&f:ContentTypeFacet=[PDF]", 8, true],
    ["https://www.pjm.com/library/reports-notices", 1],
    ["https://www.pjm.com/library/manuals.aspx", 1],
    # Transmission expansion planning studies and load forecasts
    ["https://www.pjm.com/planning/transmission-expansion-planning", 1],
    ["https://www.pjm.com/library/reports-notices/load-forecast", 1],
]
seed_pdfs = [
    "https://www.pjm.com/-/media/library/reports-notices/load-forecast/2024-load-forecast-report.ashx",
    "https://www.pjm.com/-/media/library/reports-notices/resource-adequacy/2024-rto-reserve-requirement-study.ashx",
