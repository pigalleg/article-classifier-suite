# Scoring bands (updated):
# - 0 = no relevance (treat as not relevant)
# - 1-40 = Low relevance
# - 41-80 = Moderate relevance
# - 81-120 = High relevance
# Use these ranges when interpreting example scores and when sampling examples.
examples:
# Added by populate_few_shot_ra_from_excel_evaluations.py
# Source: Excel sheet row abstract_id=65 question_id=12
  - id: id_excel_abs65_ra12
    target_type: RA
    abstract: >-
      the integration of numerous energy storage systems (esss) improves the reliable and economic operation of microgrids but also enlarges the burden of control and communication systems. this article proposes a cooperative hierarchical control for isolated microgrids with esss, which fully frees from the centralized paradigm and is therefore superior in flexibility and scalability. firstly, the ess cooperative control based on the distributed frequency controller is introduced for the state of charge (soc) balance and the frequency regulation. then, the ess aggregation is considered. the aggregated ess model is established and the real-time model parameters are derived by proposed distributed state observers. finally, energy management is employed to allocate the output power between generators and the aggregated ess. a detailed theoretical analysis of the dynamic and steady-state performance of proposed controllers and observers is provided. simulations on the ieee 33-bus and the 69-bus system verify the effectiveness of proposed methods.
    targets:
      - target_id: "12"
        score: 30
        rationale: >-
          Why this score was assigned:
          There are some potential links between the content of this abstract and the research question.  In particular Microgrids can be considered to be DERs to some extent and by controlling them you are potentially making them somewhat like an aggregated DER resource.  Some of the concepts like observability mentioned in the abstract are also potentially of interest.
          
          Why this abstract falls below the next relevance level:
          There is nothing direct within the abstract to link directly to aggregation and DERs.  The links are at best second hand.  The overall application of the abstract is on a test system not a real system and there is mention of the word theoretical which is not a confidence building term with respect to a real application.

# Added by populate_few_shot_ra_from_excel_evaluations.py
# Source: Excel sheet row abstract_id=134 question_id=21
  - id: id_excel_abs134_ra21
    target_type: RA
    abstract: >-
      power system congestion event prognosis (cep) based on multivariate time series (mts) learning is an effective way to improve the warning abilities against risky situations. however, it is still challenging to decide which measurement sequences of system variables should be selected to train mts learning-based ceps models, especially when facing high-dimensional candidate features from power systems. focusing on this issue, this paper proposes a novel high-dimensional feature selection (fs) method to identify and select variables that contain beneficial data patterns for the prognosis of network congestion events. a wrapper framework embedded with multiple mts learning models is first built to treat fs as a combinatorial optimization task and receive mts as inputs directly without sequence compressions. then, to improve the combinatorial optimization efficiency and fs results in the high-dimensional case, a hybrid structure called enhanced evolutionary computation (eec) is developed by combining with information theory-based feature priority scores, which play the role of semi-guidance in the iterative search. test results on both the real-world and synthetic datasets validate the effectiveness of the developed eec structure and show that the selected features by the proposed fs method are more beneficial in identifying the early patterns of network congestion events, thus contributing to efficient and accurate cep for power systems.
    targets:
      - target_id: "21"
        score: 50
        rationale: >-
          Why this score was assigned:
          The research in this abstract has a reasonably good link to the research question.  The abstract describes a method to identify features that can be used to enhance the potential of harnessing flexibility resources.  There is reference to a real world test results which is encouraging.
          
          Why this abstract falls below the next relevance level:
          While the links are potentially strong between the abstract and the research question they are not direct.  The abstract addresses congestion but the research question is focussed on flexibility - congestion has an impact of flexibility but is not a one to one relationship.  No clear link or working relationship with a system operator is evident.

# Added by populate_few_shot_ra_from_excel_evaluations.py
# Source: Excel sheet row abstract_id=281 question_id=36
  - id: id_excel_abs281_ra36
    target_type: RA
    abstract: >-
      energy storage (es) is a kind of promising but costly fast-frequency-response (ffr) resource in low-inertia power systems. this article addresses the minimum demand of a power system for energy capacities of es to providing sufficient frequency support, including the formulation, the optimal solution, and its practical implementation. first, the minimum energy control problem of ess for providing ffr with transient frequency constraints is formulated and then converted into an optimal frequency trajectory planning counterpart. this transformation makes the transient frequency constraint tractable and allows to identify the optimal frequency trajectory that minimizes energy demand for ess, which leads to an analytical expression of the system minimum demand for ess energy capacities to ensure frequency security. moreover, by unfolding the optimal frequency trajectory, the optimal control strategy of ess is derived explicitly for the first time. the theoretical result directs to a practical controller implementation, which is referred to as the decentralized optimal energy frequency control (doefc). finally, simulations on the modified ieee 39-bus system verify our results and demonstrate the superiority of the doefc in reducing the energy capacity demand of ess, defending successive disturbances, and hedging against parameter errors.
    targets:
      - target_id: "36"
        score: 70
        rationale: >-
          Why this score was assigned:
          Although the word services (and IBRs) do not appear in the abstract it is directed at fast frequency response (FFR) which is a service - hence it is linked with this research question.  There are strong indications that applications are on their radar which is a positive.
          
          Why this abstract falls below the next relevance level:
          The abstract is a little too focussed on the fancy internal methods and not on the interesting results around fast frequency response as a service.  Also no system operator is involved and the lack of a holistic type of approach that accounts for the multiple services required and their overlap is a shortcoming.

# Added by populate_few_shot_ra_from_excel_evaluations.py
# Source: Excel sheet row abstract_id=146 question_id=26
  - id: id_excel_abs146_ra26
    target_type: RA
    abstract: >-
      topology diagrams are widely seen in power system applications, but their automatic generation is often easier said than done. when facing power transmission systems with strongly-meshed structures, existing approaches can hardly produce topology diagrams catering to the aesthetics of readers. this paper proposes an integrated framework for generating aesthetically-pleasing topology diagrams for power transmission systems. input with a rough layout, the framework first conducts visibility region analysis to reduce line crossings and then solves a mixed-integer linear programming problem to optimize the arrangement of nodes. given that the complexity of both modules is pretty high, simplification heuristics are also proposed to enhance the efficiency of the framework. case studies on several power transmission systems containing up to 2,046 nodes demonstrate the capability of the proposed framework in generating topology diagrams conforming to aesthetic criteria in the power system community. compared with the widespread force-directed algorithm, the proposed framework can preserve the relative positions of nodes in the original layout to a great extent, which significantly contributes to the identification of electrical elements on the diagrams. meanwhile, the time consumption is acceptable for practical applications.
    targets:
      - target_id: "26"
        score: 90
        rationale: >-
          Why this score was assigned:
          Very strong link between the abstract with its focus on presenting graphically information that the user can use and interpret.  Practical application is a term used that is indicative that practical uses are being pursued.  The scale being quoted at over 2000 nodes is good to see and looks like scalability is very much in the minds of the researchers.  Case studies are done on several systems which is indicative of robustness of the results.
          
          Why this abstract falls below the next relevance level:
          The actual title of the abstract is not a good fit to the research question but the abstract text is a good fit - hence reluctance to increase the score.  There is no direct reference to control rooms which is a little concerning and there are no system operator stakeholders involved.  There is also more an emphasis on the algorithm side than on the user side and there is no mention of real time.

# Added by populate_few_shot_ra_from_excel_evaluations.py
# Source: Excel sheet row abstract_id=94 question_id=13
  - id: id_excel_abs94_ra13
    target_type: RA
    abstract: >-
      with the increasing deployment of distributed energy resources (ders), dispatching ders subject to operational constraints in distribution networks draws much attention. one challenge is the non-convexities in 1) system-wide ac power flow constraints and 2) the individual complementarity constraint of energy storage. to resolve this challenge, this paper studies an ac-feasible linear model in distribution networks with energy storage, including its formulation, analysis, and applications. first, an ac-feasible linear model is formulated as a set of linear constraints on controllable ders and uncontrollable power demand by 1) converting the non-convex system-wide constraints into linear constraints based on the brouwers fixed-point theorem and the second-order taylor expansion, and 2) replacing the non-convex individual complementarity constraint of energy storage with one properly designed linear constraint. furthermore, to analyze the power demand level at which the proposed linear model can provide a solution, this paper proposes an examination-based projection method under the monte carlo framework to handle projections of thousands of dimensions from linear constraints over time periods. finally, the potential applications of our ac-feasible linear model are discussed. numerical experiments are conducted in the ieee 33-bus and 136-bus test systems to demonstrate the effectiveness of the proposed methods.
    targets:
      - target_id: "13"
        score: 30
        rationale: >-
          Why this score was assigned:
          There are some potential links between the content of this abstract and the research question.  In particular this is about DERs and accounting for the constraints that DERs have - this is linked with the primary objective of the research question which is quantification of services and constraints in the distribution system are a key to understand that. There is also potential applications is mentioned in the abstract which is at least accepting application may be important.
          
          Why this abstract falls below the next relevance level:
          The focus of the abstract is on the distribution network and not the transmission network - in order for it to be scored higher it would need to focus on the transmission system.  The abstract is very focussed on the details of the formulation of an optimisation problem and some theory and not on the formulation of a real applied problem.  Test results are from a test system and not a real system with no obvious link to real industry stakeholders and/or real applications focussed work.

# Added by populate_few_shot_ra_from_excel_evaluations.py
# Source: Excel sheet row abstract_id=194 question_id=35
  - id: id_excel_abs194_ra35
    target_type: RA
    abstract: >-
      proactive participation of uncertain renewable generation in the day-ahead (da) wholesale market effectively reduces the system marginal price and carbon emissions, whilst significantly increasing the volumes of real-time balancing mechanism prices to ensure system security and stability. to solve the conflicting interests over the two timescales, this article: 1) proposes a novel hierarchical optimization model to align with the actual operation paradigms of the hierarchical market, whereby the capacity allocation matrix is adopted to coordinate the da and balancing markets; 2) mathematically formulates and quantitatively analyses the long-term driving factors of balancing actions, enabling system operators (sos) to design efficient and well-functioning market structures to meet economic and environmental targets; 3) empowers renewable generating units and flexible loads to participate in the balancing market (bm) as active actors and enforces the non-discriminatory provision of balancing services. the performance of the proposed model is validated on a modified ieee 39-bus power system and a reduced gb network. results reveal that with effective resource allocation in different timescales of the hierarchical market, the drop speed of balancing costs soars while the intermittent generation climbs. the proposed methodology enables sos to make the most of all resources available in the market and balance the system flexibly and economically. it thus safeguards the climate mitigation pathways against the risks of substantially higher balancing costs.
    targets:
      - target_id: "35"
        score: 30
        rationale: >-
          Why this score was assigned:
          There are potential links between the abstract and the research question.  In particular the abstract is addressing the British balancing market and the research question is asking can variable renewable energy provide services.  The link if it is there is on the methods side.
          
          Why this abstract falls below the next relevance level:
          The potential links identified between the abstract and the research question are possibly misleading so scoring any higher is simply not justified. may not actually have anything of value

# Added by populate_few_shot_ra_from_excel_evaluations.py
# Source: Excel sheet row abstract_id=44 question_id=3
  - id: id_excel_abs44_ra3
    target_type: RA
    abstract: >-
      when renewable energy-based generations are increasing, they are subject to cause frequency stability problems in a power system. to solve this problem, various virtual inertial control methods (vicms) have been recently developed. however, they all have dealt not with the steady-state frequency stability, but only with dynamic frequency stability issues. in particular, the wind power plants (wpps) operated by these vicms can only provide a similar inertial response (ir) to that by conventional synchronous generators without providing the primary frequency response (pfr). this results in lowering the settling frequency (sf) below the maximum steady-state frequency deviation (mssd) band. this paper proposes the new hierarchical control strategy for the wpps, which are operated by three virtual frequency response control methods (vfrcms) to provide both ir and pfr. firstly, the vfrcm-1 provides virtual ir. next, the vfrcm-2 increases the output power from the wpps to prevent the frequency drop, which can occur after the frequency nadir is arrested. finally, the vfrcm-3 makes the wpps possible to raise the sf above the mssd band by providing the virtual pfr. the effectiveness of proposed hierarchical control strategy is verified by several case studies on the ieee 39-bus test system with the high penetration of renewables.
    targets:
      - target_id: "3"
        score: 30
        rationale: >-
          Why this score was assigned:
          There is a potential link between the abstract which is focussed on controlling wind power plants to provide so called virtual frequency response and the research question which is focussed on the IBR control paradigm.  The assumption is that IBR control and WPP control share a lot in common.
          
          Why this abstract falls below the next relevance level:
          The link identified may not result in any synergy between the research being reported in the abstract and the research question.  While IBRs and WPPs do share some things in common the link in this instance may not actually amount to anything of interest.  There is also no mention of any real application or involvement of system operators and industry and the results are on a test system not a real system.

# Added by populate_few_shot_ra_from_excel_evaluations.py
# Source: Excel sheet row abstract_id=81 question_id=13
  - id: id_excel_abs81_ra13
    target_type: RA
    abstract: >-
      the deployment of prosumers with distributed energy resources (ders) has facilitated the prosumer-centric transactive market, giving rise to the consequent necessity for the coordination between prosumers and the distribution networks. this paper proposes an incentive-based expansion planning method considering virtual peer-to-peer (p2p) transaction among prosumers, which is characterized as a tri-level planning-operation-transaction framework. each prosumer optimizes its internal response of ders and external p2p transaction jointly, formulating virtual p2p transaction. under such a paradigm, the distribution company (disco) identifies the optimal expansion planning in the network assets, while the independent distribution system operator (idso) is responsible for the optimal operation of the expanded distribution networks. to derive appropriate incentives for each prosumer, the disco and idso allocate long-term investment network charges and short-term operation network charges on prosumers, along with the designed financial transmission rights coupling multiple time scales. through such incentives, self-profit driven virtual transactions can relieve operation problems and postpone expansion planning, acting as a short-term alternative. moreover, a risk-based approach is proposed for prosumer to flexibly change strategy according to different risk preference. finally, results from the case study demonstrate the superiority and effectiveness of the proposed method in the collaborative application of virtual transaction in the expansion planning.
    targets:
      - target_id: "13"
        score: 30
        rationale: >-
          Why this score was assigned:
          DERs and one of the stakeholders the prosumer are identified in the abstract which has potential links to  quantification of services from DERs and sharing of these among other stakeholders.
          
          Why this abstract falls below the next relevance level:
          The identified research question is in the services area yet the abstract is tackling a planning problem so the links identified are at best tangential and at worst non existent.  The whole area of transactive energy and markets is out of scope for research question so that is a poor indicator of strong links.  The application domain and/or time frame of the abstract and the research question may differ it looks like the abstract is targeting planning while the research question is in the operations time frame.

# Added by populate_few_shot_ra_from_excel_evaluations.py
# Source: Excel sheet row abstract_id=241 question_id=27
  - id: id_excel_abs241_ra27
    target_type: RA
    abstract: >-
      accurate wind power forecast (wpf) is critical for ensuring secure and economic operation of a power system, and combination forecasting approaches for wpf have been proved effective on attaining accurate forecasting results. however, the weights in a combination forecasting model are usually predetermined based on the global performance on the training set, limiting the adaptability of the model to different scenarios. to further enhance the accuracy and effectiveness of the combination forecasting approaches, this article proposes an adaptive weighted combination forecasting approach based on the deep deterministic policy gradient (ddpg) so as to consider the local behavior accompanied by the change of external environment. three sub-models are first selected considering the equal-likelihood and dispersion indices to construct a combination model. then, the ddpg agent is trained to act as a weight generator by interacting with the environment and to maximize the reward. thus, the ddpg agent can perceive the environmental changes online and dynamically weight the sub-models to attain accurate forecasting results. case studies demonstrate that the forecasting accuracy of the proposed approach is better than that of all sub-models and several benchmark combination forecasting approaches.
    targets:
      - target_id: "27"
        score: 30
        rationale: >-
          Why this score was assigned:
          This is an incremental piece of research that does not directly address any of the research questions but does potentially have some links to some aspects of the research agenda.
          
          Why this abstract falls below the next relevance level:
          There are no real practical applications.  It is mainly methodological and incremental and it is at best a small potential contribution to a very secondary aspect of the much more impactful research question.

