# organizations.toml
# ==================
# Registry of power-system organizations whose publications are fetched and indexed.
#
# Each organization section:
#   name         – full display name
#   region       – US | Europe | Global | Australia
#   crawl_pages  – list of [url, max_pages] pairs to paginate through.
#                  Append a third element `true` to fetch that page with a
#                  headless browser instead of a plain HTTP GET — needed for
#                  JS-rendered SPA search/listing pages, and for URLs that
#                  rely on a #fragment (a plain GET never sends the fragment
#                  to the server at all, so a "search#q=..." URL is silently
#                  a no-op without render=true).
#   seed_pdfs    – direct PDF URLs (supplement / fallback if crawl is blocked)
#
# Last validated: 2026-08-29

# ── US ISOs / RTOs ────────────────────────────────────────────────────────────


