[hydro-quebec]
name = "Hydro-Québec"
region = "Canada"
crawl_pages = [
    # hydroquebec.com previously blocked automated access at two levels —
    #   1. TLS handshake failure (SSLV3_ALERT_HANDSHAKE_FAILURE) against Python's requests/ssl stack
    #   2. Connection reset by peer after handshake (active bot detection)
    # render=true (headless Chromium, its own TLS stack + real browser
    # fingerprint) confirmed working 2026-08-29 — crawl completed with no
    # connection errors.
    ["https://www.hydroquebec.com/publications/en/index.html", 1, true],
    ["https://www.hydroquebec.com/planning/", 1, true],
]
seed_pdfs = [
    # development-plan.pdf and rapport-annuel.pdf (previously listed here as
    # "best-guess" paths) removed 2026-08-29: both download 200 OK but
    # contain a nav-shell page, not the report (markitdown extracts only
    # "Passer au contenu principal" / empty text) — same failure pattern as
    # IESO's dead .ashx seeds. The real, current annual report is already
    # discovered by the crawl above under a different filename — kept as an
    # explicit seed below as a safety net in case the crawl ever misses it.
    "https://www.hydroquebec.com/data/documents-donnees/pdf/hq-rapport-annuel-2025-francais.pdf",
]

